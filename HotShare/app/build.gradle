plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---- Play upload signing (secrets never committed) --------------------------
// Credentials are read from keystore.properties (project root, gitignored) or
// from environment variables. When neither is present the release build is left
// UNSIGNED rather than silently signed with a shared dev password.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = keystoreProps.getProperty('storeFile') ?: System.getenv('HOTSHARE_STORE_FILE')
def releaseStorePass = keystoreProps.getProperty('storePassword') ?: System.getenv('HOTSHARE_STORE_PASS')
def releaseKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('HOTSHARE_KEY_ALIAS') ?: 'hotshare'
def releaseKeyPass = keystoreProps.getProperty('keyPassword') ?: System.getenv('HOTSHARE_KEY_PASS') ?: releaseStorePass
def hasReleaseSigning = releaseStoreFile && releaseStorePass && releaseKeyPass &&
        rootProject.file(releaseStoreFile).exists()

android {
    namespace 'com.hotshare'
    // Google Play requires targetSdk 36 (Android 16) for new apps and updates
    // since 2026-08-31 (extension requests available until 2026-11-01).
    // AGP 8.13 supports up to API 36.1 and needs Build Tools >= 35.0.0.
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.hotshare'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.6.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        release {
            // Play AAB: R8 shrinks/obfuscates third-party code. The JNI bridge
            // (hev.htproxy.**) and app classes are kept by proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
