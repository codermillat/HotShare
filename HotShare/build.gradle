plugins {
    // AGP 8.13 is the last 8.x line: max API level 36.1, min Gradle 8.13,
    // min Build Tools 35.0.0, JDK 17. Keeps Kotlin 1.9.24 + Compose compiler
    // 1.5.14 working, so the Play targetSdk 36 bump stays a small diff.
    id 'com.android.application' version '8.13.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
